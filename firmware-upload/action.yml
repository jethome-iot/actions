name: 'Upload firmware'
description: 'Upload firmware to JetHome firmware repository'
inputs:
  fullslug:
    description: 'Full slug of the firmware. Format: <vendor>.<model>.<os>.<branch>.<distro>.<arch>'
    required: true
  url:
    required: false
    description: 'URL of the firmware site. If not specified, use jethome dev env.'
    default: 'http://test.fw.jethome.ru'
  date:
    required: false
    description: 'Date of the firmware. If not specified, it will be the current date. Format: 2022-12-07T15:54:34+03:00'
  version:
    required: false
    description: 'Version of the firmware. If not specified, it will be the current date. Format: 2022-12-07T15:54:34+03:00'
  image_type:
    required: true
    description: 'Type of the firmware'
  hashpgp_file:
    required: false
    description: 'PGP/hash of the firmware. If not specified, it will be calculated automatically in sha256 format.'
  changelog_file:
    required: false
    description: 'Changelog of the firmware. If not specified, it will be empty.'
  firmware_file:
    required: true
    description: 'Firmware file.'
  generatefirmwareslot:
    required: false
    description: 'Generate firmware slot. If not specified, it will be false.'
    default: 'false'
  force_overwrite:
    required: false
    description: 'Overwrite the firmware. If not specified, it will be true.'
    default: 'true'
  update_latest:
    required: false
    description: 'Update latest flag. If not specified, it will be false.'
    default: 'false'
  supported_devices:
    required: false
    description: 'Supported devices. If not specified, it will be empty.'
  FWUPLOAD:
    required: true
    description: 'Token for uploading firmware'

outputs:
  firmware_hash:
    description: "firmware hash"
    value: ${{ steps.deploy-to-fw-storage.outputs.hash }}

runs:
  using: "composite"
  steps:
    - name: Check data & version
      id: checkvars
      shell: bash
      env:
        INPUT_DATE: ${{ inputs.date }}
        INPUT_FULLSLUG: ${{ inputs.fullslug }}
        INPUT_VERSION: ${{ inputs.version }}
      run: bash "${GITHUB_ACTION_PATH}/scripts/checkvars.sh"


    - name: Apply fw template
      id: apply-fw-template
      shell: bash
      env:
        INPUT_FULLSLUG: ${{ inputs.fullslug }}
        INPUT_FWUPLOAD: ${{ inputs.FWUPLOAD }}
        INPUT_URL: ${{ inputs.url }}
      run: bash "${GITHUB_ACTION_PATH}/scripts/apply-fw-template.sh"

    - name: Create firmware slot
      id: add-fw-slot
      shell: bash
      env:
        CHECKVARS_DATE: ${{ steps.checkvars.outputs.date }}
        CHECKVARS_PLATFORM: ${{ steps.checkvars.outputs.platform }}
        CHECKVARS_SLUG: ${{ steps.checkvars.outputs.slug }}
        CHECKVARS_VENDOR: ${{ steps.checkvars.outputs.vendor }}
        CHECKVARS_VERSION: ${{ steps.checkvars.outputs.version }}
        INPUT_CHANGELOG_FILE: ${{ inputs.changelog_file }}
        INPUT_FWUPLOAD: ${{ inputs.FWUPLOAD }}
        INPUT_GENERATEFIRMWARESLOT: ${{ inputs.generatefirmwareslot }}
        INPUT_SUPPORTED_DEVICES: ${{ inputs.supported_devices }}
        INPUT_UPDATE_LATEST: ${{ inputs.update_latest }}
        INPUT_URL: ${{ inputs.url }}
      run: bash "${GITHUB_ACTION_PATH}/scripts/add-fw-slot.sh"

    - name: Deploy to fw storage
      id: deploy-to-fw-storage
      shell: bash
      env:
        CHECKVARS_PLATFORM: ${{ steps.checkvars.outputs.platform }}
        CHECKVARS_SLUG: ${{ steps.checkvars.outputs.slug }}
        CHECKVARS_VENDOR: ${{ steps.checkvars.outputs.vendor }}
        CHECKVARS_VERSION: ${{ steps.checkvars.outputs.version }}
        INPUT_FIRMWARE_FILE: ${{ inputs.firmware_file }}
        INPUT_FORCE_OVERWRITE: ${{ inputs.force_overwrite }}
        INPUT_FULLSLUG: ${{ inputs.fullslug }}
        INPUT_FWUPLOAD: ${{ inputs.FWUPLOAD }}
        INPUT_HASHPGP_FILE: ${{ inputs.hashpgp_file }}
        INPUT_IMAGE_TYPE: ${{ inputs.image_type }}
        INPUT_URL: ${{ inputs.url }}
      run: bash "${GITHUB_ACTION_PATH}/scripts/deploy-to-fw-storage.sh"
