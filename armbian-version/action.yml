name: 'Update Armbian VERSION from armbian-os repo'
description: 'Copy version info from stable/nightly.json to VERSION'
inputs:
  pathos:
    required: true
    description: 'path to the armbian os repo'
    default: 'os'
  patharmbian:
    required: true
    description: 'path to the armbian build repo'
    default: 'build'
  beta:
    required: true
    description: 'yes: nightly, no: stable'
    default: 'yes'

outputs:
  version:
    description: "result version"
    value: ${{ steps.copyversion.outputs.output }}

runs:
  using: "composite"
  steps:
    - name: "Copy version"
      id: copyversion
      shell: bash
      env:
        INPUT_BETA: ${{ inputs.beta }}
        INPUT_PATHARMBIAN: ${{ inputs.patharmbian }}
        INPUT_PATHOS: ${{ inputs.pathos }}
      run: bash "${GITHUB_ACTION_PATH}/scripts/copyversion.sh"
