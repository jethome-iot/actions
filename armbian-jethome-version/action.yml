name: 'Update JetHome Armbian subversion'
description: 'update stable/nightly-jethome.json'
inputs:
  file:
    required: true
    description: 'path to the json file'
    default: 'nightly-jethome.json'
  type:
    required: true
    description: 'major/minor'
    default: 'minor'
  do:
    required: true
    description: 'inc/dec/zero'
    default: 'inc'
  override:
    required: false
    description: 'override version'
    default: ''

outputs:
  version:
    description: "result version"
    value: ${{ steps.setversion.outputs.output }}

runs:
  using: "composite"
  steps:
    - name: "Set version"
      id: setversion
      shell: bash
      env:
        INPUT_DO: ${{ inputs.do }}
        INPUT_FILE: ${{ inputs.file }}
        INPUT_OVERRIDE: ${{ inputs.override }}
        INPUT_TYPE: ${{ inputs.type }}
      run: bash "${GITHUB_ACTION_PATH}/scripts/setversion.sh"
